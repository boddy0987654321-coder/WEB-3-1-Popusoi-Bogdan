<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestionarea elevilor</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous"
  >
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container py-4 py-md-5">
    <header class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-2 pb-3 mb-4 border-bottom border-dark-subtle">
      <div>
        <h1 class="h3 fw-bold mb-1">Gestionarea elevilor</h1>
      </div>
      <div class="fw-semibold border rounded px-3 py-2 bg-white">
        Total elevi: <span id="total-elevi">0</span>
      </div>
    </header>

    <div class="row g-4 align-items-start">
      <section class="col-12 col-lg-4">
        <div class="card">
          <div class="card-body p-4">
            <h2 class="h5 fw-bold mb-3" id="titlu-formular">Adaugă elev</h2>

            <form id="form-elev" novalidate>
              <div class="mb-3">
                <label for="nume" class="form-label">Nume și prenume</label>
                <input
                  type="text"
                  class="form-control"
                  id="nume"
                  placeholder="ex. Andrei Popescu"
                  required
                >
              </div>

              <div class="mb-3">
                <label for="varsta" class="form-label">Vârstă</label>
                <input
                  type="number"
                  class="form-control"
                  id="varsta"
                  min="1"
                  max="120"
                  placeholder="ex. 17"
                  required
                >
              </div>

              <div class="mb-3">
                <label for="grupa" class="form-label">Grupă / Clasă</label>
                <input
                  type="text"
                  class="form-control"
                  id="grupa"
                  placeholder="ex. DAW-241"
                  required
                >
              </div>

              <div class="mb-3">
                <label for="email" class="form-label">E-mail</label>
                <input
                  type="email"
                  class="form-control"
                  id="email"
                  placeholder="ex. andrei@scoala.md"
                  required
                >
              </div>

              <div class="alert py-2 px-3 small d-none mb-3" id="mesaj-eroare" role="alert"></div>

              <div class="d-grid gap-2">
                <button type="submit" class="btn btn-primary" id="btn-submit">
                  Adaugă elev
                </button>
                <button type="button" class="btn btn-outline-dark d-none" id="btn-anuleaza-editare">
                  Anulează
                </button>
              </div>
            </form>
          </div>
        </div>
      </section>

      <section class="col-12 col-lg-8">
        <div class="d-flex flex-column flex-sm-row gap-2 mb-3">
          <input
            type="search"
            class="form-control"
            id="cautare"
            placeholder="Caută după nume și prenume..."
            aria-label="Caută după nume și prenume"
          >
          <button
            type="button"
            class="btn btn-outline-dark text-nowrap"
            id="btn-sterge-tot"
            disabled
          >
            Șterge toți elevii
          </button>
        </div>

        <div id="lista-elevi" class="row g-3"></div>
      </section>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
