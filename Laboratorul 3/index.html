<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lucrare de laborator — Obiecte, funcții și metode în JavaScript</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Crearea de obiecte, funcții și metode în JavaScript</h1>
<p class="subtitle">Programarea client-side a site-urilor Web — Lucrare de laborator</p>

<div class="container">

  <div class="card">
    <h2>Exercițiul 3 — Piatră, Foarfecă, Hârtie</h2>  

    <div class="choices">
      <button class="choice-btn" id="btn-piatra" data-alegere="piatra">⛰️ Piatră</button>
      <button class="choice-btn" id="btn-hartie" data-alegere="hartie">📄 Hârtie</button>
      <button class="choice-btn" id="btn-foarfeca" data-alegere="foarfeca">✂️ Foarfecă</button>
    </div>

    <div class="rezultat-rundei">
      <div>
        <span class="label">Alegerea ta</span>
        <span id="alegere-utilizator">—</span>
      </div>
      <div>
        <span class="label">Alegerea calculatorului</span>
        <span id="alegere-calculator">—</span>
      </div>
    </div>

    <p id="mesaj-runda"></p>

    <div class="scor">
      <div class="scor-item">
        <div class="valoare" id="scor-player">0</div>
        <div class="eticheta">Tu</div>
      </div>
      <div class="scor-item">
        <div class="valoare" id="scor-calculator">0</div>
        <div class="eticheta">Calculator</div>
      </div>
      <div class="scor-item">
        <div class="valoare" id="scor-egalitati">0</div>
        <div class="eticheta">Egalități</div>
      </div>
    </div>

    <p id="mesaj-conducere"></p>
    <p id="mesaj-castigator"></p>

    <div class="actions">
      <button id="btn-reset">Joc nou</button>
    </div>
  </div>

</div>

<footer>Laborator — Obiecte, funcții și metode în JavaScript</footer>

<script src="script.js"></script>
<style src="style.css"></style>
</body>
</html>
