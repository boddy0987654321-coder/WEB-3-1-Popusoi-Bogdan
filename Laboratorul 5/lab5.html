<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registru Studenți</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="wrap">
  <header class="header-main">
    <div>
      <h1>Registru Studenți</h1>
    </div>
    <div class="count">
      Studenți în listă: <strong id="nr">0</strong>
    </div>
  </header>

  <div class="layout">
    <aside class="side">

      <section class="panel">
        <h2>Adaugă student</h2>
        <form id="form" onsubmit="adaugaStudent(event)">
          <div class="field full">
            <label for="f-nume">Nume și prenume</label>
            <input id="f-nume" placeholder="ex. Elena Rotaru" required>
          </div>
          
          <div class="form-row">
            <div class="field">
              <label for="f-grupa">Grupa</label>
              <input id="f-grupa" placeholder="SI-231" required>
            </div>
            <div class="field">
              <label for="f-varsta">Vârsta</label>
              <input id="f-varsta" type="number" min="14" max="100" placeholder="14–100" required>
            </div>
          </div>

          <div class="field full">
            <label for="f-spec">Specialitatea</label>
            <select id="f-spec">
              <option>Programare</option>
              <option>Securitate informațională</option>
              <option>Rețele de calculatoare</option>
              <option>Design web</option>
              <option>Analiza datelor</option>
            </select>
          </div>

          <div class="field full">
            <label for="f-avatar">Avatar</label>
            <select id="f-avatar">
              <option value="👩‍💻">👩‍💻 Programatoare</option>
              <option value="👨‍💻">👨‍💻 Programator</option>
              <option value="🧑‍🎓">🧑‍🎓 Student</option>
              <option value="👩‍🎓">👩‍🎓 Studentă</option>
              <option value="🧑‍🔬">🧑‍🔬 Cercetător</option>
            </select>
          </div>

          <button class="btn" type="submit">+ Adaugă studentul</button>
          <p class="msg" id="msg"></p>
        </form>
      </section>

      <section class="panel">
        <h2>Controale Flexbox</h2>

        <div class="ctl">
          <span>justify-content</span>
          <div class="chips">
            <button class="chip active" onclick="schimbaJustify('flex-start', this)">flex-start</button>
            <button class="chip" onclick="schimbaJustify('center', this)">center</button>
            <button class="chip" onclick="schimbaJustify('flex-end', this)">flex-end</button>
            <button class="chip" onclick="schimbaJustify('space-between', this)">space-between</button>
            <button class="chip" onclick="schimbaJustify('space-around', this)">space-around</button>
            <button class="chip" onclick="schimbaJustify('space-evenly', this)">space-evenly</button>
          </div>
        </div>

        <div class="ctl">
          <span>align-items</span>
          <div class="chips">
            <button class="chip active" onclick="schimbaAlign('stretch', this)">stretch</button>
            <button class="chip" onclick="schimbaAlign('flex-start', this)">flex-start</button>
            <button class="chip" onclick="schimbaAlign('center', this)">center</button>
            <button class="chip" onclick="schimbaAlign('flex-end', this)">flex-end</button>
            <button class="chip" onclick="schimbaAlign('baseline', this)">baseline</button>
          </div>
        </div>

        <div class="ctl">
          <span>flex-wrap</span>
          <div class="chips">
            <button class="chip active" onclick="schimbaWrap('wrap', this)">wrap</button>
            <button class="chip" onclick="schimbaWrap('nowrap', this)">nowrap</button>
          </div>
        </div>

        <div class="ctl">
          <span>gap</span>
          <div class="gaprow">
            <input id="gap" type="range" min="0" max="48" step="2" value="16" oninput="schimbaGap(this.value)">
            <output id="gap-out">16px</output>
          </div>
        </div>
      </section>

    </aside>

    <main class="stage-wrap">
      <div id="lista"></div>
    </main>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
